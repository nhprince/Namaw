<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Direct MP4 Test Fixture</title>
    <meta property="og:title" content="Big Buck Bunny 1080p Clip" />

      body {
        font-family: sans-serif;
        background: #0f172a;

        align-items: center;

      }
      video {

        width: 100%;

    <h1>Direct MP4 Playback Test</h1>

      width="640"
      height="360"
    ></video>
  </body>
</html>
